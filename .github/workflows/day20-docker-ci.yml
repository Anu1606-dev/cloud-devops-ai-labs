name: Day 20 - Docker CI Automation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-environment-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker version
        run: docker --version

      - name: Check Docker Compose version
        run: docker compose version

      - name: Prepare environment file
        run: cp day17-docker-compose/.env.example day17-docker-compose/.env

      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config --quiet
        working-directory: day17-docker-compose

      - name: Build Node.js application image
        run: docker build -t day20-day17-app:ci -f day17-docker-compose/Dockerfile.missing ./day17-docker-compose

      - name: Display success
        run: echo "Docker CI environment is ready!"
