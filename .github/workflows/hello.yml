name: Day 19 - GitHub Actions CI

on:
  push:
  pull_request:

jobs:
  repository-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Day 19 README
        run: test -f day19-github-actions/missing-file.md

      - name: Verify Day 18 health check script
        run: test -f day18-bash-health-check/health-check.sh

      - name: Validate Bash syntax
        run: bash -n day18-bash-health-check/health-check.sh

      - name: Display success
        run: echo "All CI checks passed!"
