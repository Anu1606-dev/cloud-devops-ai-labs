services:
  app:
    build: .
    container_name: day17-node-app
    ports:
      - "8080:3000"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: day17-redis
    restart: unless-stopped
